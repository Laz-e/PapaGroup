<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarVault</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="brand-group">
            <h2>CarVault</h2>
            <div class="logo-container">
                <img src="pictures/logo.png" alt="Logo">
            </div>
        </div>
    </header>

    <div class="image-container">
        <img src="pictures/5864.png" alt="Cars Display">
    </div>

    <div class="login-container">   
        <form id="loginForm">
        <h2>Sign In</h2>

            <!-- USERNAME/EMAIL -->
            <div class="first-input input-field-group">
                <input type="text" id="username" name="username" required> 
                <label for="username">Username / Email</label>
            </div>

            <!-- PASSWORD -->
            <div class="first-input input-field-group password-container">
                <input type="password" id="password" name="password" required>
                <label for="password">Password</label>
                <span class="toggle-password" id="togglePassword"></span>
            </div>

            <!-- REMEMBER ME & FORGOT PASSWORD -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>
                <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <!-- SUBMIT BUTTON -->
            <div class="container">
                <button type="submit">Login</button>                   
            </div>

            <!-- REGISTER LINK -->
           <div class="register" id="register-link">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
                <p style="text-align: center;">or</p>
                <p>Enter as <a href="frontpage.html">Guest</a></p>
            </div>
        </form>
    </div>


   <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const guestLink = document.querySelector('a[href="frontpage.html"]');
    const rememberMeCheckbox = document.querySelector('input[name="remember"]');

    // 1. AUTO-FILL ON PAGE LOAD
    window.addEventListener('load', () => {
        const savedData = JSON.parse(localStorage.getItem('rememberedUser'));
        if (savedData) {
            usernameInput.value = savedData.identity;
            passwordInput.value = savedData.pass;
            rememberMeCheckbox.checked = true;
        }
    });

    // Toggle Password Visibility
    togglePassword.textContent = '👁️'; 
    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });

    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = this.querySelector('button');
        const originalText = submitBtn.textContent;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging In...';

        setTimeout(() => {
            const enteredIdentity = usernameInput.value.toLowerCase();
            const enteredPass = passwordInput.value;

            // 2. MANAGER LOGIN
            if (enteredIdentity === "admin" && enteredPass === "manager123") {
                sessionStorage.setItem('userRole', 'manager');
                sessionStorage.setItem('activeUser', 'Manager');
                window.location.href = 'manager.html';
                return;
            }

            // 3. SEARCH USERS
            let foundUser = null;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                try {
                    const user = JSON.parse(localStorage.getItem(key));
                    if (user.username.toLowerCase() === enteredIdentity || 
                        (user.email && user.email.toLowerCase() === enteredIdentity)) {
                        foundUser = user;
                        break;
                    }
                } catch (e) { continue; }
            }

            // 4. VALIDATE & HANDLE REMEMBER ME
            if (foundUser && foundUser.password === enteredPass) {
                
                // SAVE OR REMOVE "REMEMBER ME" DATA
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('rememberedUser', JSON.stringify({
                        identity: usernameInput.value, 
                        pass: enteredPass
                    }));
                } else {
                    localStorage.removeItem('rememberedUser');
                }

                sessionStorage.setItem('userRole', 'user');
                sessionStorage.setItem('activeUser', foundUser.username); 
                window.location.href = 'frontpage.html';
            } else {
                alert(foundUser ? "Incorrect password." : "Account not found.");
                resetButton();
            }
        }, 1000);

        function resetButton() {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });

    guestLink.addEventListener('click', function(e) {
        sessionStorage.setItem('userRole', 'guest');
        sessionStorage.setItem('activeUser', 'Guest');
    });
</script>
</body>
</html>
