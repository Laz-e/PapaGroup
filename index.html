<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarVault</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="brand-group">
            <h2>CarVault</h2>
            <div class="logo-container">
                <img src="pictures/logo.png" alt="Logo">
            </div>
        </div>
    </header>

    <div class="image-container">
        <img src="pictures/5864.png" alt="Cars Display">
    </div>

    <div class="login-container">   
        <form id="loginForm" method="POST" action="login.php">
        <h2>Sign In</h2>

            <!-- USERNAME/EMAIL -->
            <div class="first-input input-field-group">
                <input type="text" id="username" name="username" required> 
                <label for="username">Username / Email</label>
            </div>

            <!-- PASSWORD -->
            <div class="first-input input-field-group password-container">
                <input type="password" id="password" name="password" required>
                <label for="password">Password</label>
                <span class="toggle-password" id="togglePassword"></span>
            </div>

            <!-- FORGOT PASSWORD -->
            <div class="form-options">
                <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <!-- SUBMIT BUTTON -->
            <div class="container">
                <button type="submit">Login</button>                   
            </div>

            <!-- REGISTER LINK -->
           <div class="register" id="register-link">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
                <p style="text-align: center;">or</p>
                <p>Enter as <a href="frontpage.html">Guest</a></p>
            </div>
        </form>
    </div>


   <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const guestLink = document.querySelector('a[href="frontpage.html"]');

    togglePassword.textContent = '👁️';
    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });

    guestLink.addEventListener('click', function() {
        sessionStorage.setItem('userRole', 'guest');
        sessionStorage.setItem('activeUser', 'Guest');
    });
</script>
</body>
</html>
