<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Register-specific overrides */
        .register-page .login-container {
            padding: 35px 30px;
            width: 350px;
        }

        .register-page .login-container h2 {
            font-size: 1.6rem;
            margin-bottom: 18px;
        }

        .register-page .first-input {
            margin-bottom: 16px;
        }

        .register-page .first-input input {
            height: 42px;
            font-size: 0.88rem;
            padding: 10px 5px 5px 5px;
        }

        .register-page .first-input label {
            font-size: 0.85rem;
        }

        .register-page .password-container {
            margin-bottom: 16px;
        }

        .register-page button {
            height: 48px;
            font-size: 1rem;
            margin-top: 10px;
        }

        .register-page .toggle-password {
            font-size: 1.1rem;
        }

        @media (max-width: 900px) {
            .register-page body {
                padding-top: 120px;
            }

            .register-page .login-container {
                width: 100%;
                max-width: 350px;
            }
        }

        @media (max-width: 600px) {
            .register-page .login-container {
                padding: 25px 18px;
                width: 100%;
            }

            .register-page .login-container h2 {
                font-size: 1.4rem;
                margin-bottom: 12px;
            }

            .register-page .first-input {
                margin-bottom: 13px;
            }

            .register-page .first-input input {
                height: 38px;
            }

            .register-page button {
                height: 44px;
            }
        }
    </style>
</head>
<body class="register-page">
       <header class="header">
        <div class="brand-group">
            <h2>CarVault</h2>
            <div class="logo-container">
                <img src="pictures/logo.png" alt="Logo">
            </div>
        </div>
    </header>
    <div class="image-container">
        <img src="pictures/5864.png" alt="Cars Display">
    </div>

    <div class="login-container">   
        <form id="registerForm">
        <h2>Create your Account</h2>
        
            <div class="first-input input-field-group">
                <input type="text" id="username" name="username" required>
                <label for="username">Username</label>
            </div>

             <div class="first-input input-field-group">
                <input type="text" id="fname" name="fname" required>
                <label for="fname">First Name</label>
            </div>

             <div class="first-input input-field-group">
                <input type="text" id="lname" name="lname" required>
                <label for="lname">Last Name</label>
            </div>

            <div class="first-input input-field-group">
                <input type="tel" id="phone" name="phone" pattern="[0-9]{11}"  required>
                <label for="phone">Phone Number (11 digits)</label>
            </div>

              <div class="first-input input-field-group">
                <input type="email" id="email" name="email" required>
                <label for="email">Email</label>
            </div>

            <div class="first-input input-field-group password-container">
                <input type="password" id="password" name="password" required>
                <label for="password">Password</label>
                <span class="toggle-password" id="togglePassword">👁️</span>
            </div>

        <button type="submit">Create Account</button>
        </form>
    </div>

    <script>
    const registerForm = document.getElementById('registerForm');
    const passwordInput = document.getElementById('password');
    const usernameInput = document.getElementById('username');

    registerForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const newUsername = usernameInput.value.trim();
        const enteredEmail = document.getElementById('email').value.trim().toLowerCase();
        const enteredPhone = document.getElementById('phone').value.trim();

        if (localStorage.getItem(newUsername)) {
            alert("Username already taken.");
            return;
        }

        const listings = JSON.parse(localStorage.getItem('carListings') || '[]');
        let contactExists = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                try {
                    const user = JSON.parse(localStorage.getItem(key));
                    if (user.email === enteredEmail || user.phone === enteredPhone) {
                        contactExists = true;
                        break;
                    }
                } catch (e) { continue; }
            }

        if (contactExists) {
            alert("Registration failed: Email or Phone number already exists");
            return;
        }

        const userData = {
            username: newUsername,
            password: passwordInput.value,
            email: enteredEmail,
            phone: enteredPhone,
            firstName: document.getElementById('fname').value, 
            lastName: document.getElementById('lname').value,

            // Verification + ratings system
            verified: enteredEmail.includes('@'),
            rating: 0,
            totalRatings: 0,
            reviews: []
        };

        localStorage.setItem(newUsername, JSON.stringify(userData));
        alert(
            userData.verified
            ? "Account created successfully! Account VERIFIED."
            : "Account created successfully! Account UNVERIFIED."
        );
        window.location.href = 'index.html';
    });
    
</script>
</body>
</html>
